# First-run setup, signed in to an account with no computer: no choice page, straight to the install page.
# Needs a phone that hasn't finished setup, signed in with `npm run phone-account` to a sandbox whose account has no
# computer (`npm run dev` without `--cloud`, docs/guides/dev-app.md), so it keeps the app's state: run it apart from
# `smoke`, whose welcome flow clears that state.
# One flow for iPhone and Android (docs/guides/test-stack.md):
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags computer-choice-empty apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - computer-choice-empty
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- extendedWaitUntil:
    visible: "Install Codync.*"
    timeout: 20000
- assertNotVisible: "Connect a computer"
- assertVisible: "Copy website link"
