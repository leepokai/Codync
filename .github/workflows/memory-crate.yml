# Ships host/crates/memory with each Codync release (docs/design/bot-memory.md#packaging): a pull request into main
# that changes the crate must raise its version; the push to main mirrors it to leepokai/codync-mem, read-only, and
# publishes that version. The split is deterministic, so each push fast-forwards the mirror as long as nobody commits
# there.
name: codync-mem

on:
  pull_request:
    branches: [main]
    paths: ["host/crates/memory/**"]
  push:
    branches: [main]
    paths: ["host/crates/memory/**"]

concurrency:
  group: memory-crate-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A changed crate has a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Its .github is the mirror's CI, not part of the package.
          if git diff --quiet "$BASE" HEAD -- host/crates/memory ':!host/crates/memory/.github'; then exit 0; fi
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          before=$(git show "$BASE:host/crates/memory/Cargo.toml" | version)
          after=$(version < host/crates/memory/Cargo.toml)
          if [ "$before" = "$after" ]; then
            echo "::error file=host/crates/memory/Cargo.toml::codync-mem changed but is still $after: raise its version."
            exit 1
          fi

  mirror:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split the crate's history
        run: git subtree split --prefix=host/crates/memory -b mirror
      - name: Push it to the mirror
        env:
          # A deploy key with write access on leepokai/codync-mem.
          KEY: ${{ secrets.CODYNC_MEM_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::CODYNC_MEM_DEPLOY_KEY isn't set, so the mirror isn't updated."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror
          chmod 600 ~/.ssh/mirror
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o StrictHostKeyChecking=accept-new" \
            git push git@github.com:leepokai/codync-mem.git mirror:main

  publish:
    # Trusted publishing: crates.io trusts this workflow file, so no token is stored.
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - name: Is this version on crates.io yet?
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/memory/Cargo.toml | head -n 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "codync-ci (https://github.com/leepokai/Codync)" \
            "https://crates.io/api/v1/crates/codync-mem/$version")
          case "$code" in
            200) echo "::notice::codync-mem $version is already on crates.io."; echo "new=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $code for codync-mem $version."; exit 1 ;;
          esac
      - name: Install Rust (rust-toolchain.toml)
        if: steps.version.outputs.new == 'true'
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.new == 'true'
        id: auth
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: cargo publish -p codync-mem --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
