name: codync-host

on:
  push:
    branches: [main, v2]
    paths: ["host/**", "apps/linux/**", "packaging/updates/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/host.yml"]
    tags: ["v*"]  # one version tag ships the Mac app, the host and the Linux app
  pull_request:
    paths: ["host/**", "apps/linux/**", "packaging/updates/**", "docs/reference/fixtures/remote-relay-vectors.json"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux-app:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev xvfb dbus-x11 imagemagick
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Verify native UI flows
        env:
          GTK_A11Y: none
          CODYNC_UI_ARTIFACTS: ${{ github.workspace }}/build/ui-parity
        run: xvfb-run -a dbus-run-session -- python3 tests/ui_fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.name }}
          path: build/ui-parity/
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # <product>-<os>-<arch>, no version: the website links to releases/latest/download/<name>.
          NAME=codync-${{ matrix.name }}
          cargo build --release
          mkdir -p $NAME/share/applications $NAME/share/icons/hicolor/scalable/apps $NAME/bin
          cp target/release/codync $NAME/bin/
          cp data/com.pokai.Codync.desktop $NAME/share/applications/
          cp data/com.pokai.Codync.svg $NAME/share/icons/hicolor/scalable/apps/
          tar czf $GITHUB_WORKSPACE/$NAME.tar.gz $NAME
          cd $GITHUB_WORKSPACE && shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            codync-linux-*.tar.gz
            codync-linux-*.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          # musl: one static binary that runs on any distro, whatever its glibc.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: host
        # Vendored C (dbus) would call libgcc's outline atomics, which a static musl link lacks.
        env:
          CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo 'Host version must match release tag'; exit 1; }
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME=codync-host-${{ matrix.name }}
          mkdir $NAME
          cp host/target/${{ matrix.target }}/release/codync-host $NAME/
          cp LICENSE $NAME/
          tar czf $NAME.tar.gz $NAME
          shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256
      - name: Sign host update manifest
        env:
          HOST_UPDATE_SIGNING_KEY: ${{ secrets.HOST_UPDATE_SIGNING_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/update-signing"
          "$RUNNER_TEMP/update-signing/bin/pip" install 'cryptography>=44,<47'
          "$RUNNER_TEMP/update-signing/bin/python" packaging/updates/sign-host-release.py \
            "codync-host-${{ matrix.name }}.tar.gz" \
            --version "$GITHUB_REF_NAME" --platform "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            codync-host-*.tar.gz
            codync-host-*.tar.gz.sha256
            codync-host-*.update.json
            codync-host-*.update.json.sig

  homebrew:
    # Keeps `brew install leepokai/codync/codync-host` (Linux, headless Macs) in step with releases.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the tap's formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --pattern 'codync-host-*.sha256' --dir sums
          sha() { cut -d' ' -f1 "sums/codync-host-$1.tar.gz.sha256"; }
          sed -e "s/^  version .*/  version \"$VERSION\"/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha macos-arm64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha macos-x86_64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha linux-arm64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha linux-x86_64)/" \
              packaging/homebrew/codync-host.rb > codync-host.rb
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/leepokai/homebrew-codync.git tap
          mkdir -p tap/Formula && cp codync-host.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "codync-host $VERSION" || exit 0
          git push
