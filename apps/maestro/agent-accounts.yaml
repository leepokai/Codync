# Agent accounts on the phones (docs/features/agent-accounts.md): a bot's details show the account it runs on under
# Agent, by the name the user gave it, and move it back to the default account; the agent's setup lists both under
# Accounts, the account as "Not signed in", renames the default one with its pencil, and removes the account once no
# bot uses it (before that the host refuses). Nothing here signs in: the account stays signed out, and the computer's
# own login is never touched (its name goes back when the flow completes). The phone must already be signed in and
# paired with the host (a worktree's sandbox, docs/guides/dev-app.md#worktree-sandboxes), so run it apart from
# `welcome`, whose clearState undoes that. The computer needs an agent that can have accounts installed (Claude Code,
# Codex, OpenCode, Pi…; two, for the two phones in one run: see agent-accounts.js); without, the flow does nothing.
# Not here: a fallback on an account, which needs a signed-in one (the desktop spec adds the default login as one).
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags agents \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - agents
onFlowComplete:
  - runScript:
      file: agent-accounts.js
      env:
        CLEANUP: "true"
---
- runScript: agent-accounts.js
- runFlow:
    when:
      true: ${output.accounts != null}
    commands:
      - runScript:
          file: agent-accounts.js
          env:
            STEP: refused
      - runFlow:
          when:
            platform: iOS
          commands:
            - launchApp:
                appId: com.pokai.Codync.ios.dev
                arguments:
                  "-reviewInvitationOff": true
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                appId: com.pokai.Codync.android.dev
      - tapOn: ${output.accounts.name}
      - tapOn: "${output.accounts.name}, view details"
      - tapOn: "Details"
      # The Account row under Agent: the bot's own account stays listed while it's signed out.
      - scrollUntilVisible:
          element: ${output.accounts.work}
          centerElement: true
      - tapOn: ${output.accounts.work}
      - tapOn: ${output.accounts.home}
      - assertVisible: ${output.accounts.home}
      - runScript:
          file: agent-accounts.js
          env:
            STEP: moved
      # Add account… opens the agent's setup, which lists the account and removes it now that no bot uses it.
      - tapOn: ${output.accounts.home}
      - tapOn: "Add account…"
      - scrollUntilVisible:
          element: "Not signed in"
          centerElement: true
      - assertVisible: "Accounts"
      - assertVisible: ${output.accounts.work}
      - assertVisible: ${output.accounts.home}
      - takeScreenshot: agent-accounts
      # The pencil names an account in a dialog: the default one's is the first.
      - tapOn:
          text: "Rename account"
          index: 0
      - eraseText
      - inputText: ${output.accounts.renamed}
      - tapOn: "Save"
      - assertVisible: ${output.accounts.renamed}
      - runScript:
          file: agent-accounts.js
          env:
            STEP: renamed
      - tapOn: "Remove account"
      - extendedWaitUntil:
          notVisible: ${output.accounts.work}
          timeout: 20000
      - runScript:
          file: agent-accounts.js
          env:
            STEP: removed
