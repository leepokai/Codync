# A bot's task shows as one capsule over the composer: it opens the task's details, and Stop asks once. A task's
# approval card in the chat says it comes from the background, and its report comes back as the bot's message. The phone
# must already be signed in and paired with the host (a worktree's sandbox, docs/guides/dev-app.md#worktree-sandboxes),
# so run it apart from `welcome`, whose clearState undoes that; the flow makes its own bot there:
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags tasks \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" \
#     -e TASK_AGENT="$PWD/host/tests/fixtures/task_agent.py" apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - tasks
onFlowComplete:
  - runScript:
      file: tasks.js
      env:
        CLEANUP: "true"
---
- runScript: tasks.js
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- tapOn: ${output.bot.name}
- assertVisible: "In the background · .*"
- takeScreenshot: tasks-capsule
# Its details: the task's own transcript, with what it was told, and no composer.
- tapOn: "In the background · .*"
- assertVisible: "Audit the repo"
- assertVisible: ".*HOLD until released.*"
- takeScreenshot: tasks-details
- tapOn: "Close"
# Stop asks once.
- tapOn: "Stop"
- assertVisible: "Stop the background work\\?"
- assertVisible: "What it already changed stays."
- tapOn: "Cancel"
- assertVisible: "In the background · .*"
- tapOn: "Stop"
- tapOn:
    text: "Stop"
    below: "What it already changed stays."
- assertNotVisible: "In the background · .*"
# A task's card is answered in the chat, and says where it comes from.
- runScript:
    file: tasks.js
    env:
      SEND: "START Run the suite|PERMISSION first"
- assertVisible: "In the background · Run the suite"
- takeScreenshot: tasks-card
- tapOn: "Allow once"
- assertVisible: "Relayed: .*"
- assertNotVisible: "In the background · .*"
