# State > Usage limits lists the computer's agents, each with a switch: turning one on and off reaches the host, which
# keeps the choice. The phone must already be signed in and paired with the host (a worktree's sandbox,
# docs/guides/dev-app.md#worktree-sandboxes), and the computer must list two agents:
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags usage \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - usage
---
- runScript: usage-chooser.js
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- tapOn: "State"
- tapOn: "Usage limits"
- scrollUntilVisible:
    element: "On by default for the agents your bots run."
    direction: DOWN
- assertVisible: "Show usage for"
- takeScreenshot: usage-chooser
# Below the heading: an agent with a reading has a card above, under the same name.
- tapOn:
    text: "${output.agent}.*"
    below: "Show usage for"
- runScript:
    file: usage-chooser.js
    env:
      EXPECT: "true"
- scrollUntilVisible:
    element: "On by default for the agents your bots run."
    direction: DOWN
- tapOn:
    text: "${output.agent}.*"
    below: "Show usage for"
- runScript:
    file: usage-chooser.js
    env:
      EXPECT: "false"
