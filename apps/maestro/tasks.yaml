# A bot's event box on the phones. One task working is a capsule over the composer, which opens the bot's details:
# Threads says how many run of the most allowed (`1 / 3`) with a Free row per thread not in use, and the row opens its
# thread, where a message written while it works waits and can be taken back. With the ceiling at 1, what is added
# next waits in the Event box, numbered in order; First moves a waiting task to the front, Drop (touch and hold) takes
# one out, and Cut in asks which working task gives way: that one returns to the event box. Stop on the capsule asks
# once. A thread's approval card is in the chat and says which task it comes from (`Work · <title>`); its row on the
# Threads tab opens the thread, where the card is answered, and its report comes back as the bot's message. A routine's
# run opens read only, with Stop. The sign-in card of an agent the thread needs signing in to is in the chat too, its
# row in the details names the agent and leads to it, and the task goes on once a turn of that agent ends well (it
# is signed in). A stopped task is tried again from Recent, and Threads at once in Settings moves the ceiling. A row
# reads as one element on iPhone
# (its number, title and line together) and as separate texts on Android, hence the `.*` around titles. The phone must
# already be signed in and paired with the host (a worktree's sandbox, docs/guides/dev-app.md#worktree-sandboxes), so
# run it apart from `welcome`, whose clearState undoes that; the flow makes its own bot there:
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags tasks \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" \
#     -e TASK_AGENT="$PWD/host/tests/fixtures/work_agent.py" apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - tasks
onFlowComplete:
  - runScript:
      file: tasks.js
      env:
        CLEANUP: "true"
---
- runScript: tasks.js
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- extendedWaitUntil:
    visible: ${output.bot.name}
    timeout: 30000
# Search, in the Bots tab's header, keeps the bots whose name has what's typed; closing it (Close on iPhone, Cancel on
# Android) brings the list back.
- tapOn: "Search"
- inputText: "no such bot"
- extendedWaitUntil:
    notVisible: ${output.bot.name}
    timeout: 10000
- tapOn: "(Close|Cancel)"
- extendedWaitUntil:
    visible: ${output.bot.name}
    timeout: 10000
# Every thread, on the Threads tab: the working task is a row of its own (the coding agent's icon, its title and its mark), with no Free rows.
# (The tab's count of working tasks may read after its name.) Its filter button offers the list's groupings. The row
# pushes its thread over the list, in the chat's form, and Back returns to the list.
- tapOn: "Threads(, .*)?"
- extendedWaitUntil:
    visible: ".*Audit the repo.*"
    timeout: 20000
- assertNotVisible: "Free"
- tapOn: "Computers, .*Filter conversations"
- assertVisible: "Group by folder"
- assertVisible: "Group by bot"
- runFlow: subflows/close-menu.yaml
- takeScreenshot: tasks-all-work
# Search, in its header, finds threads by title or bot; Close (Cancel on Android) brings the list back.
- tapOn: "Search"
- inputText: "no such thread"
- extendedWaitUntil:
    visible: "No results"
    timeout: 10000
- tapOn: "(Close|Cancel)"
- extendedWaitUntil:
    visible: ".*Audit the repo.*"
    timeout: 10000
- tapOn: ".*Audit the repo.*"
- extendedWaitUntil:
    visible: "Message this thread"
    timeout: 10000
- assertVisible: "Details"
- runFlow: subflows/thread-back.yaml
- extendedWaitUntil:
    visible: ".*Audit the repo.*"
    timeout: 10000
# New thread, in the Threads header, pushes the new-thread page (a chat nothing was said in yet) and, sent, becomes the
# thread's chat once it has its thread; Back goes to the list. It opens on No bot (as the desktop's), and the bot chip
# in the composer's row picks the bot. It ends at once, so one task still works below.
- runFlow: subflows/bot-list.yaml
- tapOn: "Threads(, .*)?"
- tapOn: "New thread"
- assertVisible: "New thread with .*"
- assertVisible: "No bot"
# Without a bot, the chip beside it opens the model panel on the agent's models. A thread without a bot runs on one of
# the computer's installed agents, not the flow's stand-in, so the flow sends with its bot (as the desktop's work.spec.ts).
- tapOn: "Model"
- assertVisible: "Search models"
# Approvals are a bot's: none without one.
- assertNotVisible: "Approvals"
- runFlow:
    when:
      platform: iOS
    commands:
      # From the panel's top row, not its list, whose pull reads the models again.
      - swipe:
          from: "Search models"
          direction: DOWN
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: "Choose a bot"
- tapOn: ${output.bot.name}
- tapOn: "What should it work on\\?"
- inputText: "Say hello"
# The page's composer sits over the keyboard: on iOS Maestro's typing hides the keyboard until the next touch, which
# lifts the composer, so touch the text and let it settle before Send (as reply-part.yaml does).
- tapOn: "Say hello"
- waitForAnimationToEnd
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Message this thread"
    timeout: 20000
- runFlow: subflows/thread-back.yaml
- extendedWaitUntil:
    visible: "New thread"
    timeout: 10000
# The page became the thread's chat: Back returns to the list, not to the empty new-thread page.
- assertNotVisible: "What should it work on\\?"
# One task working, in the bot's chat: the capsule.
- runFlow: subflows/bot-list.yaml
- tapOn: ${output.bot.name}
- extendedWaitUntil:
    visible: "Work · .*"
    timeout: 20000
- takeScreenshot: tasks-capsule
# It opens the bot's details: one thread of three runs, and the threads not in use show.
- tapOn: "Work · .*"
- assertVisible: "Threads"
- assertVisible: "1 / 3"
- assertVisible: "Free"
- assertVisible: ".*Audit the repo.*"
- assertNotVisible: "Event box"
- takeScreenshot: tasks-threads
# The row pushes its thread inside the details, in the chat's form (no Details button there): what the task was told
# is folded on top, and the composer writes to it.
- tapOn: ".*Audit the repo.*"
- extendedWaitUntil:
    visible: "Message this thread"
    timeout: 10000
- assertNotVisible: "Threads"
- assertNotVisible: "Details"
- tapOn: "What it was told"
- assertVisible: ".*HOLD:audit.*"
# The thread's box takes files, as the chat's does.
- assertVisible: "Add files"
# A message written while the task's turn runs waits over the composer, where Remove takes it back.
- tapOn: "Message this thread"
- inputText: "also the docs"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "also the docs"
    timeout: 10000
- assertVisible: "Send now"
- takeScreenshot: tasks-thread
- tapOn: "Remove"
- extendedWaitUntil:
    notVisible: "also the docs"
    timeout: 10000
# Back returns to Details, and on iPhone so does a swipe to the right anywhere on the thread.
# Typing left Android's input method up, whose own nav button is also named Back: the page's Back is the one above.
- tapOn:
    text: "Back"
    above: "What it was told"
- extendedWaitUntil:
    visible: "Threads"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ".*Audit the repo.*"
      - extendedWaitUntil:
          visible: "Message this thread"
          timeout: 10000
      - swipe:
          start: 10%, 50%
          end: 90%, 50%
      - extendedWaitUntil:
          visible: "Threads"
          timeout: 10000
# With the ceiling at 1, what is added next waits in the Event box, numbered in the order it will be taken.
- runScript:
    file: tasks.js
    env:
      MAX: "1"
- runScript:
    file: tasks.js
    env:
      ADD: "Write the docs|HOLD:docs"
- runScript:
    file: tasks.js
    env:
      ADD: "Fix the build|HOLD:build"
- extendedWaitUntil:
    visible: "1 / 1"
    timeout: 10000
- assertNotVisible: "Free"
- scrollUntilVisible:
    element: ".*Fix the build.*"
    centerElement: true
- assertVisible: "Event box"
- assertVisible: "1(, Write the docs.*)?"
- assertVisible: "2(, Fix the build.*)?"
- assertVisible:
    text: ".*Write the docs.*"
    above: ".*Fix the build.*"
- takeScreenshot: tasks-event-box
# First, on every waiting row but the first: the task moves to the front.
- tapOn: "First"
- extendedWaitUntil:
    visible:
      text: ".*Fix the build.*"
      above: ".*Write the docs.*"
    timeout: 10000
# Drop is in a row's touch-and-hold menu.
- longPressOn: ".*Write the docs.*"
- tapOn: "Drop"
- extendedWaitUntil:
    notVisible: ".*Write the docs.*"
    timeout: 10000
# Cut in, on the first waiting row while every thread is busy, asks which working task gives way.
- tapOn: "Cut in"
- assertVisible: "Let \"Fix the build\" cut in"
- assertVisible: "Every thread is busy\\. Pick the task that gives way: its thread closes and the task starts again later\\."
- takeScreenshot: tasks-cut-in
- tapOn: "Audit the repo · .*"
# The one that gave way is back in the box, and says so.
- extendedWaitUntil:
    visible: ".*Was cut in on; starts again.*"
    timeout: 10000
- assertVisible: "1 / 1"
- longPressOn: ".*Audit the repo.*"
- tapOn: "Drop"
- extendedWaitUntil:
    notVisible: "Event box"
    timeout: 10000
- tapOn: "Close details"
# Stop on the capsule asks once.
- tapOn: "Stop"
- assertVisible: "Stop this task\\?"
- assertVisible: "What it already changed stays."
- tapOn: "Cancel"
- assertVisible: "Work · .*"
- tapOn: "Stop"
- tapOn:
    text: "Stop"
    below: "What it already changed stays."
- extendedWaitUntil:
    notVisible: "Work · .*"
    timeout: 10000
# The stopped task is under Recent in the bot's details, where Try again takes it up again.
- tapOn: "${output.bot.name}, view details"
- scrollUntilVisible:
    element: "Try again"
    centerElement: true
- assertVisible: "Recent"
- tapOn: "Try again"
- scrollUntilVisible:
    element: "1 / 1"
    direction: UP
# Threads at once, in Settings, is the ceiling Threads counts against (the system stepper on iPhone, ours on Android).
# The page is still settling after Try again moved the row. Each scroll here waits for the page to settle, which on a
# busy emulator takes most of the default 20 s for the few it needs.
- waitForAnimationToEnd
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Threads at once"
    centerElement: true
    timeout: 60000
# The iPhone's stepper names its buttons by identifier (their text is the value); ours on Android by label.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "Increment"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Increase"
- scrollUntilVisible:
    element: "Details"
    direction: UP
    timeout: 60000
- tapOn: "Details"
- extendedWaitUntil:
    visible: "1 / 2"
    timeout: 10000
- assertVisible: "Free"
- tapOn: "Close details"
- tapOn: "Stop"
- tapOn:
    text: "Stop"
    below: "What it already changed stays."
- extendedWaitUntil:
    notVisible: "Work · .*"
    timeout: 10000
# A task's card is in the chat, and says where it comes from.
- runScript:
    file: tasks.js
    env:
      ADD: "Run the suite|PERMISSION"
- extendedWaitUntil:
    visible: "Work · Run the suite"
    timeout: 20000
- assertVisible: "Run the tests"
- takeScreenshot: tasks-card
# Its row on the Threads tab opens its thread, where the card is the chat's own row and is answered.
- runFlow: subflows/bot-list.yaml
- tapOn: "Threads(, .*)?"
- tapOn: ".*Run the suite.*"
- extendedWaitUntil:
    visible: "Message this thread"
    timeout: 10000
- extendedWaitUntil:
    visible: "Allow once"
    timeout: 10000
- takeScreenshot: tasks-thread-card
- tapOn: "Allow once"
- runFlow: subflows/thread-back.yaml
# Its report comes back as the bot's message.
- runFlow: subflows/bot-list.yaml
- tapOn: ${output.bot.name}
- extendedWaitUntil:
    visible: "Relayed: Report Run the suite.*"
    timeout: 20000
# The answered card keeps its line; the capsule, and its Stop, is what goes.
- assertNotVisible: "Stop"
# A task's choice card is in the chat too, saying where it comes from, without the row for the user's own words
# (typing doesn't answer a task): an option answers it.
- runScript:
    file: tasks.js
    env:
      ADD: "Pick a branch|ASK"
- extendedWaitUntil:
    visible: "Work · Pick a branch"
    timeout: 20000
- assertVisible: "Which\\?"
- assertNotVisible: "Something else"
- takeScreenshot: tasks-choice
- tapOn:
    id: decision-option-0
- extendedWaitUntil:
    visible: "Relayed: Report Pick a branch.*"
    timeout: 20000
# A routine's run is read only: its thread has no composer, says why, and Stop (asking first) ends the run.
- runScript:
    file: tasks.js
    env:
      ROUTINE: "Digest"
- runFlow: subflows/bot-list.yaml
- tapOn: "Threads(, .*)?"
- extendedWaitUntil:
    visible: ".*Digest.*"
    timeout: 20000
# With the list grouped by folder (its default), the run is a row under its routine's heading, named by when it
# started; the heading itself folds the group.
- tapOn:
    text: "Today .*"
    below: ".*Digest.*"
- extendedWaitUntil:
    visible: "Read only: a routine.s run"
    timeout: 10000
- assertNotVisible: "Message this thread"
- takeScreenshot: tasks-read-only
- tapOn: "Stop"
- tapOn:
    text: "Stop"
    below: "What it already changed stays."
- extendedWaitUntil:
    notVisible: "Stop"
    timeout: 10000
- runFlow: subflows/thread-back.yaml
- runFlow: subflows/bot-list.yaml
- tapOn: ${output.bot.name}
# A task whose agent needs signing in asks in the chat too, and its row says which agent and leads to the card.
- runScript:
    file: tasks.js
    env:
      SIGN_IN: "Log in"
- extendedWaitUntil:
    visible: "Work · Log in"
    timeout: 20000
- assertVisible: "Kimi Code"
- takeScreenshot: tasks-sign-in
- tapOn: "Work · (Needs you.*)?"
- assertVisible: ".*Needs Kimi Code sign-in.*"
- tapOn: ".*Log in.*"
- extendedWaitUntil:
    visible: "Work · Log in"
    timeout: 10000
- assertNotVisible: "Threads"
# A turn of the agent that ends well says it is signed in: the task goes on in its thread and reports.
- runScript:
    file: tasks.js
    env:
      SAY: "hello"
- extendedWaitUntil:
    visible: "Relayed: Report Log in.*"
    timeout: 30000
