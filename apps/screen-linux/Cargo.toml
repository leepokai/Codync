[package]
name = "codync-screen"
version = "2.1.0"
edition = "2024"
description = "Codync Remote screen helper for Linux: xdg portals + PipeWire + GStreamer WebRTC"
license = "MIT"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection", "tokio"] }
base64 = "0.22"
dirs = "7"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-sdp = { package = "gstreamer-sdp", version = "0.25" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.25", features = ["v1_22"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
# Portal calls take `Default::default()` options everywhere; product names in docs read fine.
default_trait_access = "allow"
doc_markdown = "allow"
unwrap_used = "warn"
