# Pinned so a new stable release can't break clippy -D warnings overnight.
# Keep the version equal to apps/screen-linux/rust-toolchain.toml (docs/guides/development.md#rust-toolchain).
# Bump deliberately: change both, run clippy on both, commit.
[toolchain]
channel = "1.99.0"
# llvm-tools: on macOS rustc strips (`strip = true`) with the toolchain's rust-objcopy, which finds its libLLVM only
# there; without it every Mac build left the host unstripped ("stripping debug info with `rust-objcopy` failed").
components = ["clippy", "rustfmt", "llvm-tools"]
