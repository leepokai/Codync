# A bot's dev servers on the phones: the port under the chat's title, then their section first in the bot's details, a
# row's ⋯ menu with what applies, the logs sheet, and stop, start and remove. The phone must already be signed in and
# paired with the host (a worktree's sandbox, docs/guides/dev-app.md#worktree-sandboxes), so run it apart from `welcome`,
# whose clearState undoes that; the flow makes its own bot there:
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags dev-servers \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" apps/maestro
appId: com.pokai.Codync.ios.dev
tags:
  - dev-servers
onFlowComplete:
  - runScript:
      file: dev-servers.js
      env:
        CLEANUP: "true"
---
- runScript: dev-servers.js
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- tapOn: ${output.bot.name}
- assertVisible: ".*:${output.port}.*"
- takeScreenshot: dev-servers-title
- tapOn: ".*:${output.port}.*"
- assertVisible: "Dev servers"
- assertVisible: "web"
- assertVisible: "docs"
- assertVisible: "Failed to start"
- takeScreenshot: dev-servers-details
# On all interfaces: the menu opens it, with Open or, when this computer has several addresses, a row for each. Those
# leave the app, so they're only read.
- assertVisible: ":${output.sharedPort}"
- tapOn: "More actions for shared"
- assertVisible: "Copy address"
- runFlow:
    when:
      notVisible: "Open"
    commands:
      - assertVisible: ".+:${output.sharedPort}"
- tapOn: "Stop"
- assertVisible: "Stopped"
- tapOn: "More actions for shared"
- tapOn: "Remove"
- assertNotVisible: "Remove"
- assertNotVisible: "shared"
# It listens only on the computer: the menu says so, and offers no way to open it.
- tapOn: "More actions for web"
- assertVisible: "Only reachable on the computer"
- assertNotVisible: "Copy address"
- assertVisible: "Restart"
- tapOn: "Logs"
- assertVisible: ".*-m http.server ${output.port}.*"
- takeScreenshot: dev-servers-logs
- tapOn: "Close"
- tapOn: "More actions for web"
- tapOn: "Stop"
- assertVisible: "Stopped"
- assertNotVisible: ".*:${output.port}.*"
- tapOn: "More actions for web"
- tapOn: "Start"
- assertVisible: ":${output.port}"
- tapOn: "More actions for web"
- tapOn: "Stop"
- assertVisible: "Stopped"
- tapOn: "More actions for web"
- tapOn: "Remove"
# A menu left open hides the rows behind it from Maestro, so the gone row alone doesn't show the tap worked.
- assertNotVisible: "Remove"
- assertVisible: "docs"
- assertNotVisible: "web"
# One that failed: a tap on its row reads why.
- tapOn: "docs"
- assertVisible: ".*Exit code 3"
- assertVisible: "no such script"
- tapOn: "Close"
- tapOn: "More actions for docs"
- assertVisible: "Start"
- tapOn: "Remove"
- assertNotVisible: "Remove"
- assertNotVisible: "Dev servers"
