# The Bots tab's filter menu's "Sort by last active" (the computer's host-synced "Move active bots to the top") follows a
# change made on another device (the desktop, the terminal UI) while the phone stays connected: the host's `autoOrder`
# event. The phone must already be signed in and connected to the host (a worktree's sandbox,
# docs/guides/dev-app.md#worktree-sandboxes), so run it apart from `welcome`:
#   maestro --device "<simulator udid>,<adb serial>" test --shard-all 2 --include-tags computer-order \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" apps/maestro
# The menu is opened afresh for each check (the filter button, top right; named Computers and how many are connected)
# and closed again after it. Android reports the checked option on its row (the text is a child of it), hence the
# per-platform checks.
appId: com.pokai.Codync.ios.dev
tags:
  - computer-order
onFlowComplete:
  - runScript:
      file: auto-order.js
      env:
        RESTORE: "true"
---
- runScript:
    file: auto-order.js
    env:
      ENABLED: "false"
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- extendedWaitUntil:
    visible: "(Settings|Skip)"
    timeout: 20000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    file: subflows/last-active.yaml
    env:
      ON: "false"
# The menu's device-local layout options sit beside it: each toggled on and back off, so later flows see the defaults.
- runFlow:
    file: subflows/toggle-layout.yaml
    env:
      OPTION: "Sort by status"
- runFlow:
    file: subflows/toggle-layout.yaml
    env:
      OPTION: "Group by computer"
- runScript:
    file: auto-order.js
    env:
      ENABLED: "true"
- runFlow:
    file: subflows/last-active.yaml
    env:
      ON: "true"
- takeScreenshot: auto-order-followed
- runScript:
    file: auto-order.js
    env:
      ENABLED: "false"
- runFlow:
    file: subflows/last-active.yaml
    env:
      ON: "false"
