# The user names their own computer from its card in Manage computers (long press, Rename…), and an empty name goes
# back to its hostname; a name set on another device shows up while the phone stays connected (the host's `name`
# event). The phone must already be signed in and connected to the host (a worktree's sandbox,
# docs/guides/dev-app.md#worktree-sandboxes), so run it apart from `welcome`:
#   maestro --device <simulator udid or adb serial> test --include-tags computer-name \
#     -e HOST_PORT=<sandbox port> -e HOST_TOKEN="$(cat ~/.codync-dev-<sandbox name>/token)" apps/maestro
# Both phones rename the same computer, so run one device after the other, not `--shard-all`.
appId: com.pokai.Codync.ios.dev
tags:
  - computer-name
onFlowComplete:
  - runScript:
      file: computer-name.js
      env:
        NAME: ""
---
- runScript:
    file: computer-name.js
    env:
      NAME: ""
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          appId: com.pokai.Codync.ios.dev
          arguments:
            "-reviewInvitationOff": true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: com.pokai.Codync.android.dev
- extendedWaitUntil:
    visible: "(Settings|Skip)"
    timeout: 20000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
# The bot list's header (Computers, or how many are connected) opens a menu that leads there.
- runFlow:
    when:
      notVisible: "Manage computers"
    commands:
      - tapOn: "(Computers|\\d+ connected)"
- runFlow:
    when:
      visible: "Manage computers"
    commands:
      - tapOn: "Manage computers"
- extendedWaitUntil:
    visible: ${output.hostname}
    timeout: 20000
- longPressOn: ${output.hostname}
- tapOn: "Rename…"
- assertVisible: "Computer name"
- assertVisible: "Leave it empty to use the hostname."
- eraseText
- inputText: "Phone Mac"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Phone Mac"
    timeout: 10000
- runScript:
    file: computer-name.js
    env:
      EXPECT: "Phone Mac"
- takeScreenshot: computer-name-renamed
# Emptied, it goes back to the hostname.
- longPressOn: "Phone Mac"
- tapOn: "Rename…"
- eraseText
- tapOn: "Save"
- extendedWaitUntil:
    visible: ${output.hostname}
    timeout: 10000
- runScript:
    file: computer-name.js
    env:
      EXPECT: "hostname"
# Named on another device: the card follows.
- runScript:
    file: computer-name.js
    env:
      NAME: "Desk Mac"
- extendedWaitUntil:
    visible: "Desk Mac"
    timeout: 10000
