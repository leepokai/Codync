name: codync-host

on:
  push:
    tags: ["v*"]  # one version tag ships the host and the desktop app (release-desktop.yml)
    # dev: the same archives to the dev release channel (docs/guides/development.md#dev-release-channel).
    # The paths apply to dev pushes only, never to tags.
    branches: [dev]
    paths: ["host/**", "apps/screen-linux/**", "packaging/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", "packaging/updates/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/host.yml"]

# A newer push to the same PR supersedes the run in progress; tag and dev runs always finish (dev runs queue, so
# channel uploads never overlap).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tags ship a commit its PR already tested.
  test:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        # Windows hosts ship inside the desktop app (release-desktop.yml), so no release archive below.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Cargo only warns when a patch stops applying (vendor/noq-udp/CODYNC.md).
      - name: The noq-udp patch applies
        if: runner.os == 'Linux'
        run: |
          if grep -q '^\[\[patch.unused\]\]' Cargo.lock || grep -A2 '^name = "noq-udp"' Cargo.lock | grep -q '^source'; then
            echo 'noq-udp no longer comes from vendor/noq-udp: see vendor/noq-udp/CODYNC.md'; exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Each test in its own process (`host/.config/nextest.toml`): fixture hosts share no
      # process-global locks, so Windows runs them side by side too, and a test that only passes
      # on a retry shows as FLAKY instead of failing the run. The host has no doctests.
      - run: cargo nextest run --workspace --profile ci

  # Tags publish to GitHub's releases; dev pushes publish the same archives, signed alike, to the dev channel (R2),
  # from this repository only (a fork has neither key). Each platform builds with no secret and a read-only token;
  # `release` signs and publishes once all of them are built, on a runner that never runs the project's build code
  # (build scripts, proc macros, dependencies), so none of it can reach the signing key.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/dev' && github.repository == 'leepokai/Codync')
    strategy:
      matrix:
        include:
          # musl: one static binary that runs on any distro, whatever its glibc.
          # codync-screen (Remote screen on Linux) links the system GStreamer 1.22+, so it is built
          # for glibc on Ubuntu 24.04 and ships next to the host in the same archive.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup reads the pin from the folder it runs in (host/rust-toolchain.toml).
      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - name: Build
        working-directory: host
        # Vendored C (dbus) would call libgcc's outline atomics, which a static musl link lacks.
        env:
          CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
          CODYNC_ENV: main  # released hosts use the main cloud; local builds use dev
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$VERSION" = "$GITHUB_REF_NAME" || { echo 'Host version must match release tag'; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cargo build --release --target ${{ matrix.target }}
      - name: Build codync-screen
        if: runner.os == 'Linux'
        working-directory: apps/screen-linux
        run: |
          rustup toolchain install
          cargo build --release
      - name: Package
        run: |
          NAME=codync-host-${{ matrix.name }}
          mkdir $NAME
          cp host/target/${{ matrix.target }}/release/codync-host $NAME/
          if [ "$RUNNER_OS" = Linux ]; then
            cp apps/screen-linux/target/release/codync-screen $NAME/
            # The computer-use driver the host starts from beside itself (pinned, checked).
            node packaging/cua-driver/fetch.mjs ${{ matrix.name }} $NAME/
          fi
          cp LICENSE $NAME/
          tar czf $NAME.tar.gz $NAME
          shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256
      # Once per release: the installer cloud computers run from their channel, and the oldest app this host works
      # with, which the cloud's soft update reads (cloud/src/host-releases.ts).
      - name: Release-wide assets
        if: matrix.name == 'linux-x86_64'
        run: |
          cp packaging/install.sh .
          MIN_APP=$(sed -n 's/^pub const MIN_APP: &str = "\([0-9.]*\)";$/\1/p' host/src/compat.rs)
          test -n "$MIN_APP" || { echo 'MIN_APP not found in host/src/compat.rs'; exit 1; }
          printf '{"version":"%s","minApp":"%s"}\n' "$VERSION" "$MIN_APP" > codync-host-compat.json
      - uses: actions/upload-artifact@v4
        with:
          name: codync-host-${{ matrix.name }}
          path: |
            codync-host-*.tar.gz
            codync-host-*.tar.gz.sha256
            install.sh
            codync-host-compat.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The channel this run publishes to: a host takes only manifests that point into its own channel.
      RELEASES: ${{ github.ref_type == 'tag' && 'https://github.com/leepokai/Codync/releases' || 'https://dev-releases.codync.dev' }}
    steps:
      # Only the signer and the public key it checks against.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: packaging/updates
      - uses: actions/download-artifact@v4
        with:
          pattern: codync-host-*
          path: dist
          merge-multiple: true
      - name: Sign host update manifests
        env:
          HOST_UPDATE_SIGNING_KEY: ${{ secrets.HOST_UPDATE_SIGNING_KEY }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("dist/codync-host-compat.json"))["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/update-signing"
          "$RUNNER_TEMP/update-signing/bin/pip" install 'cryptography>=44,<47'
          for platform in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64; do
            "$RUNNER_TEMP/update-signing/bin/python" packaging/updates/sign-host-release.py \
              "dist/codync-host-$platform.tar.gz" --version "v$VERSION" --platform "$platform" --base "$RELEASES"
          done
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            dist/codync-host-*.tar.gz
            dist/codync-host-*.tar.gz.sha256
            dist/install.sh
            dist/codync-host-compat.json
      # The update manifests last: the release gate takes a release with all its feeds as fully uploaded.
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            dist/codync-host-*.update.json
            dist/codync-host-*.update.json.sig
      # The dev channel has no latest mark to hold: the version's own folder first, then `latest/`, each with the
      # update manifests last, as on GitHub. A rebuilt version replaces its files (versions are bumped by hand).
      - name: Publish to the dev channel
        if: github.ref_type == 'branch'
        working-directory: dist
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEV_RELEASES_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_RELEASES_R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2: https://86e54cb705d376990d1aad6bbda2c553.r2.cloudflarestorage.com
        run: |
          for dir in "download/v$VERSION" latest/download; do
            for f in codync-host-*.tar.gz codync-host-*.tar.gz.sha256 install.sh codync-host-compat.json \
              codync-host-*.update.json codync-host-*.update.json.sig; do
              aws s3 cp "$f" "s3://codync-releases-dev/$dir/$f" --endpoint-url "$R2" --cache-control no-cache --only-show-errors
            done
          done
