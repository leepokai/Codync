# Generate the Xcode project with: xcodegen generate
name: Codync
options:
  bundleIdPrefix: com.pokai
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  CodyncKit:
    path: kit
settings:
  base:
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 17
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7FUM8A8H72
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  macOS:
    type: application
    platform: macOS
    sources:
      - apps/macos
    dependencies:
      - package: CodyncKit
        product: CodyncKit
      - package: CodyncKit
        product: CodyncUI
    settings:
      base:
        PRODUCT_NAME: Codync
        PRODUCT_BUNDLE_IDENTIFIER: com.pokai.Codync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Codync
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed codync-host
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Builds the Rust host and ships it inside Codync.app/Contents/MacOS.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v cargo >/dev/null; then
            echo "warning: cargo not found; Codync.app will look for codync-host on PATH instead"
            exit 0
          fi
          PROFILE=release
          [ "$CONFIGURATION" = "Debug" ] && PROFILE=debug
          FLAGS=""
          [ "$PROFILE" = "release" ] && FLAGS="--release"
          if [ "$PROFILE" = "release" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin >/dev/null 2>&1 || true
            cargo build --release --manifest-path "$SRCROOT/host/Cargo.toml" --target aarch64-apple-darwin &&
            cargo build --release --manifest-path "$SRCROOT/host/Cargo.toml" --target x86_64-apple-darwin &&
            lipo -create -output "$SRCROOT/host/target/codync-host-universal" \
              "$SRCROOT/host/target/aarch64-apple-darwin/release/codync-host" \
              "$SRCROOT/host/target/x86_64-apple-darwin/release/codync-host" &&
            BIN="$SRCROOT/host/target/codync-host-universal" ||
            { cargo build --release --manifest-path "$SRCROOT/host/Cargo.toml" && BIN="$SRCROOT/host/target/release/codync-host"; }
          else
            cargo build --manifest-path "$SRCROOT/host/Cargo.toml" && BIN="$SRCROOT/host/target/debug/codync-host"
          fi
          [ -n "$BIN" ] || { echo "error: building codync-host failed"; exit 1; }
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/codync-host"
          cp "$BIN" "$DEST"
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST"
          fi
  iOS:
    type: application
    platform: iOS
    sources:
      - path: apps/ios
        excludes:
          - Widgets
    dependencies:
      - package: CodyncKit
        product: CodyncKit
      - package: CodyncKit
        product: CodyncUI
      - target: Widgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Codync
        PRODUCT_BUNDLE_IDENTIFIER: com.pokai.Codync.ios
        INFOPLIST_FILE: apps/ios/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: apps/ios/Resources/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Codync
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown on your computer.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Codync connects to the computer running your bots on your local network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - apps/ios/Widgets
    dependencies:
      - package: CodyncKit
        product: CodyncKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: CodyncWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.pokai.Codync.ios.LiveActivity
        INFOPLIST_FILE: apps/ios/Widgets/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: apps/ios/Widgets/Resources/Widgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Codync
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
