[package]
name = "codync-mem"
version = "0.3.3"
edition = "2024"
rust-version = "1.88"
description = "Memory for coding-agent bots: one store, the rules for who may write it, and what each session sees"
license = "Apache-2.0"
repository = "https://github.com/leepokai/codync-mem"
readme = "README.md"
keywords = ["agent", "memory", "acp", "sqlite"]
categories = ["database"]
# The mirror's CI, not part of the package.
exclude = [".github"]

[dependencies]
# Callers pass their own connection, so the crate re-exports this rusqlite: one build can't link two.
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Written out instead of inherited from the Codync workspace, so the crate also builds on its own.
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
