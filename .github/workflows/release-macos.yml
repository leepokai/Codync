name: Release macOS

on:
  push:
    tags: ["v*"]
  # A dry run from any branch: builds, signs and notarizes, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}
          else VERSION=$(awk '/MARKETING_VERSION:/ {print $2; exit}' project.yml); fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_FILE=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"

          security import "$CERT_FILE" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_FILE"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"

          security list-keychain -d user -s "$KEYCHAIN_FILE"

      - name: Metal toolchain
        # SwiftTerm (setup terminals) ships a Metal shader.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: |
          xcodebuild build \
            -project Codync.xcodeproj \
            -scheme macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/derived \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Sign app with Developer ID
        run: |
          APP_PATH=$(find build/derived -name "Codync.app" -path "*/Release/*" | head -1)
          # Sign-in and the cloud relay read their settings from here.
          test -f "$APP_PATH/Contents/Resources/AccountConfig.plist" || { echo "AccountConfig.plist missing"; exit 1; }
          sign() { codesign --force --options runtime --timestamp --sign "Developer ID Application" "$1"; }
          # Inside out: frameworks, the Screen helper, the bundled Rust host, then the app itself.
          SCREEN="$APP_PATH/Contents/Library/LoginItems/CodyncScreen.app"
          find "$APP_PATH" -name "*.framework" -prune -print0 | while IFS= read -r -d '' f; do sign "$f"; done
          sign "$SCREEN"
          sign "$APP_PATH/Contents/MacOS/codync-host"
          sign "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Codync.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/Codync.app" \
            "$RUNNER_TEMP/codync-submit.zip"

          xcrun notarytool submit "$RUNNER_TEMP/codync-submit.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/Codync.app"

      - name: Create DMG
        run: |
          DMG_DIR=$RUNNER_TEMP/dmg_staging
          mkdir -p "$DMG_DIR"
          cp -R "$RUNNER_TEMP/Codync.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "Codync" -srcfolder "$DMG_DIR" \
            -ov -format UDZO build/Codync-macOS.dmg
          spctl --assess --type execute -v "$RUNNER_TEMP/Codync.app"

      - name: Keep the dry run's DMG
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Codync-macOS
          path: build/Codync-macOS.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The host workflow may have created this release already (same tag).
          gh release create ${{ github.ref_name }} \
            build/Codync-macOS.dmg \
            --title "Codync ${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload ${{ github.ref_name }} build/Codync-macOS.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA=$(shasum -a 256 build/Codync-macOS.dmg | awk '{print $1}')
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/leepokai/homebrew-codync.git tap
          cat > tap/Casks/codync.rb << RUBY
          cask "codync" do
            version "${{ env.VERSION }}"
            sha256 "${SHA}"

            url "https://github.com/leepokai/Codync/releases/download/v#{version}/Codync-macOS.dmg"
            name "Codync"
            desc "Message your coding agents (Claude Code, Codex, OpenCode) from your iPhone"
            homepage "https://codync.dev"

            app "Codync.app"
            binary "#{appdir}/Codync.app/Contents/MacOS/codync-host"

            zap trash: [
              "~/Library/Preferences/com.pokai.Codync.plist",
              "~/.codync",
            ]
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Codync to ${{ env.VERSION }}" || exit 0
          git push
