[package]
name = "codync-gtk"
version = "2.0.0"
edition = "2024"
description = "Codync for Linux: message your coding-agent bots (GTK 4 + libadwaita)"
license = "MIT"

[[bin]]
name = "codync"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
async-channel = "2"
futures = "0.3"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
dirs = "7"
