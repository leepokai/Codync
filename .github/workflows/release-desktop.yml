name: Release desktop

# The Electron app (apps/desktop) for macOS, Linux and Windows. A v* tag publishes it; anything else is a
# dry run that builds and signs but publishes nothing. Notarizing (minutes of waiting on Apple) runs on
# tags and on release PRs into main, so a notarization problem still shows before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same PR supersedes the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.scope.outputs.package }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Package on this run?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Tags, manual runs and release PRs into main always package. Other PRs package only when they
        # touch what the installers are built from: the main process, preload, build config, tools,
        # resources, dependencies, the shared app config, the Mac screen helper and packaging/. A
        # renderer-only change is covered by typecheck, tests and the build.
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" = main ]; then
            echo package=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^(apps/desktop/(package(-lock)?\.json|electron-builder[^/]*|electron\.vite\.config\.ts|tools/|src/main/|src/preload/|src/shared/|resources/|native/)|apps/shared/Config/|apps/screen-macos/|packaging/|\.github/workflows/release-desktop\.yml)'; then
            echo package=true >> "$GITHUB_OUTPUT"
          else
            echo package=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Version matches the host
        # The host's minApp is compared with this app's version (docs/reference/compatibility.md).
        run: |
          APP=$(node -p 'require("./package.json").version')
          HOST=$(python3 -c 'import tomllib; print(tomllib.load(open("../../host/Cargo.toml", "rb"))["package"]["version"])')
          test "$APP" = "$HOST" || { echo "apps/desktop ($APP) and host ($HOST) versions must match"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    needs: check
    # Fork PRs get no signing secrets, so they stop at check, Windows and Linux; the release PR into main
    # builds the Mac app before the tag.
    if: needs.check.outputs.package == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: host
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          # Saved on main by rust-cache.yml.
          shared-key: desktop-macos

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_FILE=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychain -d user -s "$KEYCHAIN_FILE"

      - name: Native pieces
        run: |
          mkdir -p apps/desktop/build/native
          # The host is built by `npm run dist:mac:main` (tools/native-host.mjs) for the same environment.
          # On-device speech for calls.
          swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos
          cp "$(swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos --show-bin-path)/codync-speech" \
            apps/desktop/build/native/codync-speech
          # Codync Screen is built by `npm run dist:mac:main` (tools/native-screen.mjs).
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/project.yml
          swift packaging/dmg/background.swift apps/desktop/build/dmg-background.tiff

      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # Same-repo PRs get the secrets; sign them too so the dry run checks the real app.
          CSC_FOR_PULL_REQUEST: "true"
          # Notarized with the App Store Connect API key: unlike an app-specific password, it
          # survives Apple ID password changes.
          NOTARIZE: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$APPLE_API_KEY"
          # electron-builder skips notarizing only when all three are unset (one alone is an error).
          [ "$NOTARIZE" = true ] || unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          npm ci
          npm run icons
          npm run dist:mac:main -- --publish never
          codesign -d --entitlements - dist/mac-universal/Codync.app | grep -q com.apple.security.device.audio-input ||
            { echo "audio-input entitlement missing"; exit 1; }
          if [ "$NOTARIZE" = true ]; then spctl --assess --type execute -v dist/mac-universal/Codync.app; fi

      - name: Update feeds
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=$(node -p 'require("./apps/desktop/package.json").version')
          # Installs of the earlier native app update through Sparkle: one more appcast, now for the zip.
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is required'; exit 1; }
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz | tar xJ -C "$RUNNER_TEMP"
          mkdir -p build/updates && cp apps/desktop/dist/codync-macos.zip build/updates/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/leepokai/Codync/releases/download/v${VERSION}/" \
            --link https://www.codync.dev/ -o build/appcast.xml build/updates
          python3 -m venv "$RUNNER_TEMP/update-verification"
          "$RUNNER_TEMP/update-verification/bin/pip" install 'cryptography>=44,<47'
          "$RUNNER_TEMP/update-verification/bin/python" packaging/updates/verify-appcast.py \
            build/appcast.xml apps/desktop/dist/mac-universal/Codync.app apps/desktop/dist/codync-macos.zip

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-macos
          path: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/latest-mac.yml
            build/appcast.xml

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop/dist
          shasum -a 256 codync-macos.dmg > codync-macos.dmg.sha256
          FILES="codync-macos.dmg codync-macos.dmg.sha256 codync-macos.zip codync-macos.zip.blockmap"
          # Auto Tag or the host workflow has usually created this release already (same tag). Not
          # latest: release-gate.yml marks it (and updates the Homebrew tap) once it's safe to offer.
          gh release create "$GITHUB_REF_NAME" $FILES --title "Codync $GITHUB_REF_NAME" --generate-notes --latest=false ||
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          # Update feeds last: the release gate takes a release with all its feeds as fully uploaded.
          gh release upload "$GITHUB_REF_NAME" latest-mac.yml ../../../build/appcast.xml --clobber

  windows:
    needs: check
    if: needs.check.outputs.package == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (host/rust-toolchain.toml)
        working-directory: host
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build
        working-directory: apps/desktop
        # Unsigned for now: SmartScreen warns on first launch until the app has a code signing certificate.
        run: |
          npm ci
          node --test --experimental-strip-types src/shared/ssh-platform.test.ts
          npm run dist:win:main -- --publish never
          cd dist
          sha256sum codync-windows-x64.exe > codync-windows-x64.exe.sha256
      - name: Smoke test the bundled host
        working-directory: apps/desktop/dist/win-unpacked/resources
        run: |
          ./codync-host.exe --version
          CODYNC_HOME="$RUNNER_TEMP/codync" ./codync-host.exe serve --port 19333 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19333/health && break; sleep 1; done
          curl -sf http://127.0.0.1:19333/health | grep -q computerId
          TOKEN=$(cat "$RUNNER_TEMP/codync/token")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:19333/api/refreshBackends
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-windows-x64
          path: |
            apps/desktop/dist/codync-windows-x64.exe
            apps/desktop/dist/latest.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: |
            apps/desktop/dist/codync-windows-x64.exe
            apps/desktop/dist/codync-windows-x64.exe.sha256
            apps/desktop/dist/codync-windows-x64.exe.blockmap
      # The update feed last, once the installer it points at is downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/latest.yml

  linux:
    needs: check
    if: needs.check.outputs.package == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The Linux app uses the installed codync-host (codync-host-linux-*.tar.gz, host.yml).
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:linux:main -- --${{ matrix.arch }} --publish never
          # The website links releases/latest/download/codync-<os>-<arch>.tar.gz.
          cd dist
          # electron-builder names x64 tar.gz `x64` and deb `amd64`; the update feed follows the renames.
          for f in codync-linux-x64.* codync-linux-amd64.*; do
            [ -e "$f" ] || continue
            to="codync-${{ matrix.name }}.${f#*.}"
            mv "$f" "$to"
            sed -i "s|$f|$to|g" latest-linux*.yml
          done
          for f in codync-${{ matrix.name }}.*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-${{ matrix.name }}
          path: apps/desktop/dist/codync-${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/codync-${{ matrix.name }}.*
      # The update feed last, once the packages it points at are downloadable.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: false
          files: apps/desktop/dist/latest-linux*.yml
