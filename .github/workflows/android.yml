name: Android

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/android/**"
      - "apps/project.yml"
      - "docs/reference/fixtures/remote-relay-vectors.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/project.yml"
      - "docs/reference/fixtures/remote-relay-vectors.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/agent_icons_test.py
      # PRs run the tests, compile and lint. The minified release build (R8) runs once a change lands on
      # dev or main, before a tag ships it.
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug ${{ github.event_name != 'pull_request' && ':app:assembleRelease' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: codync-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
