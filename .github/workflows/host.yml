name: codync-host

on:
  push:
    branches: [main, v2]
    paths: ["host/**", "apps/linux/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/host.yml"]
    tags: ["v*"]  # one version tag ships the Mac app, the host and the Linux app
  pull_request:
    paths: ["host/**", "apps/linux/**", "docs/reference/fixtures/remote-relay-vectors.json"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  linux-app:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # <product>-<os>-<arch>, no version: the website links to releases/latest/download/<name>.
          NAME=codync-${{ matrix.name }}
          cargo build --release
          mkdir -p $NAME/share/applications $NAME/share/icons/hicolor/scalable/apps $NAME/bin
          cp target/release/codync $NAME/bin/
          cp data/com.pokai.Codync.desktop $NAME/share/applications/
          cp data/com.pokai.Codync.svg $NAME/share/icons/hicolor/scalable/apps/
          tar czf $GITHUB_WORKSPACE/$NAME.tar.gz $NAME
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: codync-linux-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: host
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME=codync-host-${{ matrix.name }}
          mkdir $NAME
          cp host/target/${{ matrix.target }}/release/codync-host $NAME/
          cp LICENSE $NAME/
          tar czf $NAME.tar.gz $NAME
          shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            codync-host-*.tar.gz
            codync-host-*.tar.gz.sha256

  homebrew:
    # Keeps `brew install leepokai/codync/codync-host` (Linux, headless Macs) in step with releases.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the tap's formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --pattern 'codync-host-*.sha256' --dir sums
          sha() { cut -d' ' -f1 "sums/codync-host-$1.tar.gz.sha256"; }
          sed -e "s/^  version .*/  version \"$VERSION\"/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha macos-arm64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha macos-x86_64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha linux-arm64)/" \
              -e "0,/REPLACE_WITH_SHA256/s//$(sha linux-x86_64)/" \
              packaging/homebrew/codync-host.rb > codync-host.rb
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/leepokai/homebrew-codync.git tap
          mkdir -p tap/Formula && cp codync-host.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "codync-host $VERSION" || exit 0
          git push
