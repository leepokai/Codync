name: Auto Tag

on:
  push:
    branches: [main]
    paths:
      - "apps/Codync.xcodeproj/project.pbxproj"

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_TOKEN }}

      - name: Read version from pbxproj
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' apps/Codync.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create tag and release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            # Created here, before the build jobs upload to it, so it carries a description.
            tools/release-notes.sh "$TAG" > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
            # Announce it in the Discord server's #releases channel. A release created with
            # GITHUB_TOKEN triggers no `release` workflow, so this happens here.
            jq -n --arg tag "$TAG" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" --rawfile notes notes.md \
              '{embeds: [{title: "Codync \($tag)", url: $url, color: 16777215,
                description: (if ($notes | test("\\S")) then $notes[0:4000] else "See the release notes." end)}]}' |
              curl -fsS -X POST -H "Content-Type: application/json" --data @- "$DISCORD_RELEASES_WEBHOOK" ||
              echo "::warning::Couldn't post $TAG to Discord"
          fi
